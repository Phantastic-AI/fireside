<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireside — clickable prototype</title>
<meta name="description" content="Fireside — an open-source call for speakers. Clickable prototype, 20 screens.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23221E17'/%3E%3Cpath d='M16 5c1.6 4.2-1.4 6-1.4 8.6 0 1.6 1.2 2.6 2.4 2.6 1.5 0 2.3-1.1 2.2-2.6 2.2 1.9 3.3 4.2 3.3 6.6 0 3.9-3 6.8-6.5 6.8S9.5 24.1 9.5 20.2C9.5 14.3 14.6 11.6 16 5z' fill='%23E08A3C'/%3E%3C/svg%3E">
<style>
/* ============================================================
   FIRESIDE UI — one token set, two registers.
   Onstage  = public + speaker. Sched-warm, roomy, serif moment.
   Backstage = organizer. Calm professional density, ember accent.
   No webfonts, no network requests, nothing under 13px.
   ============================================================ */

:root{
  /* paper + ink */
  --ink:#221E17; --ink-soft:#3B342A; --muted:#726858; --muted-2:#8E8474;
  --card:#FFFFFF;
  --line:#E7DFD3; --line-soft:#F0E9DE; --field-line:#D8CEBE; --placeholder:#B4A996;

  /* ember — the one accent */
  --ember:#B14D14; --ember-btn:#A94E15; --ember-btn-hi:#93400F;
  --ember-wash:#FAEEE3; --ember-line:#E9CBAB;

  --go:#1B6E45; --go-wash:#E9F1EB;
  --danger:#9E241C; --danger-wash:#F8E9E7;
  --highlight:#FFF1B8;

  /* tracks — the same colour on the call, the list, the agenda, the public page */
  --t-platform:#186B78;   --t-platform-w:#E2EFF1;
  --t-practice:#8B3A62;   --t-practice-w:#F7E7EE;
  --t-leadership:#6E6224; --t-leadership-w:#F2EEDC;
  --t-delivery:#186B78;   --t-delivery-w:#E2EFF1;
  --t-reliability:#8B3A62;--t-reliability-w:#F7E7EE;

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI','Helvetica Neue',Helvetica,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;

  --r:10px; --r-sm:7px;
  --shadow:0 1px 1px rgba(34,30,23,.035), 0 2px 6px rgba(34,30,23,.05);
  --shadow-lift:0 2px 4px rgba(34,30,23,.06), 0 10px 28px rgba(34,30,23,.10);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#EFE9E0;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- registers ---------- */
.onstage{--paper:#FAF7F2;--paper-deep:#F1EADD;font-size:16.5px;line-height:1.55}
.backstage{--paper:#F6F3EE;--paper-deep:#EDE8DF;font-size:15px;line-height:1.5}
.stage{background:var(--paper);min-height:100vh;display:flex;flex-direction:column}

/* ---------- shared type ---------- */
.serif{font-family:var(--serif)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
.display{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.12}
.onstage .display{font-size:clamp(30px,5.2vw,46px)}
.backstage .display{font-size:clamp(25px,3.4vw,32px);font-weight:400}
.display b{font-weight:800}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);font-weight:650}
.lede{font-size:1.06em;color:var(--ink-soft);max-width:46em}
.sub{color:var(--muted);font-size:.87em}
.prose{max-width:46em}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:.86em;background:var(--paper-deep);
  padding:.1em .38em;border-radius:5px;color:var(--ink-soft)}
.hint{font-size:13.5px;color:var(--muted);margin-top:5px;max-width:44em}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:940px;margin:0 auto;padding:0 22px}
.wrap-wide{max-width:1180px}
main{flex:1 0 auto;padding-bottom:64px}
.sec{margin-top:34px}
.rule{border:0;border-top:1px solid var(--line);margin:28px 0}

/* ---------- masthead: onstage ---------- */
.mast{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30;
  backdrop-filter:saturate(1.1) blur(6px)}
.mast-in{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--serif);
  font-size:19px;letter-spacing:-.01em;font-weight:600}
.brand svg{flex:none}
.mast nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mast nav a{text-decoration:none;font-size:14.5px;color:var(--ink-soft);padding:7px 11px;border-radius:8px;white-space:nowrap}
.mast nav a:hover{background:var(--paper-deep)}
.mast nav a[aria-current]{color:var(--ember);font-weight:620;background:var(--ember-wash)}

/* ---------- masthead: backstage ---------- */
.bs-top{background:#201C16;color:#F3EDE3;position:sticky;top:0;z-index:30}
.bs-top-in{display:flex;align-items:center;gap:14px;height:50px}
.bs-top .brand{color:#F6F1E8;font-size:17px}
.evt-switch{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);color:#F3EDE3;border-radius:8px;padding:5px 10px;
  font-size:13.5px;cursor:pointer;text-decoration:none}
.evt-switch:hover{background:rgba(255,255,255,.16)}
.bs-me{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13.5px;color:#CFC5B6}
.bs-nav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:29}
.bs-nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bs-nav-in::-webkit-scrollbar{display:none}
.bs-nav a,.bs-nav span{white-space:nowrap;text-decoration:none;font-size:14px;padding:11px 12px;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.bs-nav a:hover{color:var(--ink)}
.bs-nav span[aria-current]{color:var(--ink);font-weight:640;border-bottom-color:var(--ember)}
.crumb{font-size:13.5px;color:var(--muted);padding:14px 0 0}
.crumb a{color:var(--ember);text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);margin-top:auto;padding:22px 0 34px;font-size:13.5px;color:var(--muted)}
.foot-in{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.foot .fname{font-family:var(--serif);color:var(--ink-soft)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--field-line);background:var(--card);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-sm);font-size:14.5px;font-weight:560;
  cursor:pointer;text-decoration:none;line-height:1.35;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--paper-deep);border-color:var(--muted-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ember-btn);border-color:var(--ember-btn);color:#fff}
.btn-primary:hover{background:var(--ember-btn-hi);border-color:var(--ember-btn-hi)}
.btn-lg{padding:12px 20px;font-size:16px;border-radius:9px}
.btn-sm{padding:5px 10px;font-size:13.5px}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ember)}
.btn-quiet:hover{background:var(--ember-wash);border-color:transparent}
.btn-danger{color:var(--danger);border-color:var(--field-line)}
.btn-danger:hover{background:var(--danger-wash);border-color:#DFBBB6}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.link{color:var(--ember);text-decoration:none;font-weight:560}
.link:hover{text-decoration:underline}
.link-out{white-space:nowrap}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- chips: words first, colour second ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:3px 9px;border-radius:100px;border:1px solid var(--line);background:var(--paper-deep);
  color:var(--ink-soft);white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--muted-2);flex:none}
.chip.s-accepted{background:var(--go-wash);border-color:#CBE0D1;color:#145635}
.chip.s-accepted::before{background:var(--go);border-radius:50%}
.chip.s-maybe{background:#FBF3DA;border-color:#E8DCAF;color:#6A5410}
.chip.s-maybe::before{background:#B98E14;border-radius:0;transform:rotate(45deg);width:6px;height:6px}
.chip.s-declined{background:var(--paper-deep);border-color:var(--line);color:var(--muted)}
.chip.s-declined::before{background:var(--muted-2);height:2px;border-radius:1px;width:8px}
.chip.s-undecided{background:var(--ember-wash);border-color:var(--ember-line);color:#8B3D0E}
.chip.s-undecided::before{background:var(--ember);border-radius:50%;box-shadow:0 0 0 2px #FAEEE3}
.chip.s-draft{background:transparent;border-style:dashed;color:var(--muted)}
.chip.s-draft::before{background:transparent;border:1px dashed var(--muted-2)}
.chip.s-withdrawn{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.s-withdrawn::before{background:transparent;border:1px solid var(--muted-2);border-radius:50%}
.chip.warn{background:var(--danger-wash);border-color:#E4C4BF;color:var(--danger)}
.chip.warn::before{background:var(--danger)}
.chip.plain::before{display:none}
.chip.notold{background:var(--highlight);border-color:#E7D98A;color:#5A4A0C}
.chip.notold::before{background:#9C8412}

/* track chips + lanes */
.tk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:620;white-space:nowrap;
  padding:2px 9px;border-radius:100px;background:var(--tw);color:var(--tc);border:1px solid transparent}
.tk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc);flex:none}

/* ---------- avatars ---------- */
.av{border-radius:50%;flex:none;display:block;background:var(--paper-deep);max-width:none}
.avwrap{flex:none;display:inline-flex}
.avstack{display:inline-flex;align-items:center}
.avstack .av{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}
.avstack .av:first-child{margin-left:0}
.byline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#241F18;color:#F7F2E9;padding:10px 16px;border-radius:100px;font-size:14.5px;
  box-shadow:var(--shadow-lift);animation:tin .22s ease-out, tout .5s ease-in 3.1s forwards}
.toast b{font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(34,30,23,.42);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:20px;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:24px;
  box-shadow:var(--shadow-lift);animation:pop .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.dlg h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:9px}
.dlg p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;line-height:1.55}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:22px}
.f-lab{display:flex;align-items:baseline;gap:10px;font-size:14.5px;font-weight:620;margin-bottom:6px}
.f-lab .opt{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=email],input[type=tel],textarea,select{
  width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--field-line);border-radius:var(--r-sm);padding:10px 12px;
  transition:border-color .12s,box-shadow .12s}
textarea{line-height:1.55;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-wash)}
.ghosted{position:relative}
.ghosthint{font-size:12.5px;color:var(--placeholder);margin-top:4px;display:none;align-items:center;gap:5px}
.ghosted:focus-within .ghosthint{display:flex}
kbd{font-family:var(--sans);font-size:11.5px;font-weight:650;border:1px solid var(--field-line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--card);color:var(--ink-soft)}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--field-line);border-radius:var(--r-sm);
  padding:11px 13px;cursor:pointer;background:var(--card);transition:border-color .12s,background .12s}
.radio:hover{background:var(--paper-deep)}
.radio input{margin:2px 0 0;accent-color:var(--tc,var(--ember));width:17px;height:17px;flex:none}
.radio.on{border-color:var(--tc,var(--ember));background:var(--tw,var(--ember-wash));box-shadow:inset 0 0 0 1px var(--tc,var(--ember))}
.radio .rname{font-weight:620;font-size:15px}
.radio .rsub{font-size:13.5px;color:var(--muted)}
.counter{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- tables (backstage) ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{border-collapse:collapse;width:100%;min-width:780px;font-size:14.5px}
table.t th{text-align:left;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  font-weight:650;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper)}
table.t td{padding:13px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:#FCFAF6}
.t-name{font-weight:620}
.t-sub{font-size:13px;color:var(--muted)}

/* ---------- attention card ---------- */
.attn{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--highlight);
  border:1px solid #E7D98A;border-radius:var(--r);padding:16px 18px}
.attn .n{font-family:var(--serif);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.attn .lab{font-weight:640;font-size:15px}
.attn .why{font-size:13.5px;color:#5A4A0C}
.attn .go{margin-left:auto}

/* ---------- mirror grid (anti-features) — pairs align, row by row ---------- */
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;border-top:1px solid var(--line);margin-top:8px}
.mirror h3{font-size:14px;letter-spacing:.03em;padding:16px 0 10px;font-weight:700;align-self:end}
.mirror h3.hh{color:var(--danger)}
.mirror h3.hp{color:var(--go)}
.mi{padding:12px 0 12px 26px;position:relative;border-top:1px solid var(--line-soft);
  font-size:15px;line-height:1.5;color:var(--ink-soft)}
.mi::before{position:absolute;left:2px;top:12px;font-weight:700}
.mi.hate::before{content:"✗";color:var(--danger)}
.mi.proud::before{content:"✓";color:var(--go)}
.mi.proud{color:var(--ink)}
.confess{grid-column:1/-1;border-top:1px solid var(--line);padding:16px 0 0;margin:6px 0 0;
  font-style:italic;color:var(--muted);font-family:var(--serif);font-size:15.5px}

/* ---------- event cards (landing) ---------- */
.evcards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.evcard{display:flex;flex-direction:column;gap:10px;padding:22px;text-decoration:none;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.1),box-shadow .16s}
.evcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.evcard h3{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.evcard .when{font-size:14.5px;color:var(--muted)}
.evcard .state{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.evcard .cta{margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--go);flex:none;
  box-shadow:0 0 0 3px var(--go-wash)}
.dot.closed{background:var(--muted-2);box-shadow:0 0 0 3px var(--paper-deep)}

/* ---------- public agenda ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.fchip{border:1px solid var(--field-line);background:var(--card);border-radius:100px;padding:6px 13px;
  font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink-soft);white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px}
.fchip:hover{background:var(--paper-deep)}
.fchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#F7F2E9;font-weight:600}
.fchip.tkchip[aria-pressed=true]{background:var(--tc);border-color:var(--tc);color:#fff}
.fchip.tkchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.fchip.tkchip[aria-pressed=true]::before{background:#fff}
.daybar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scrollx{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scrollx::-webkit-scrollbar{display:none}

.dayhead{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.slot{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.sesh{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc);
  border-radius:var(--r);overflow:hidden;transition:box-shadow .15s,transform .15s}
.sesh:hover{box-shadow:var(--shadow-lift)}
.sesh-main{flex:1;padding:15px 17px;min-width:0}
.sesh-when{display:flex;gap:9px;align-items:baseline;font-size:13.5px;color:var(--muted);margin-bottom:5px;flex-wrap:wrap}
.sesh-when .time{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:14.5px}
.sesh-when .room{font-weight:600;color:var(--ink-soft)}
.sesh h3{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 0 8px}
.sesh h3 a{text-decoration:none}
.sesh h3 a:hover{text-decoration:underline;text-decoration-color:var(--tc);text-underline-offset:3px}
.sesh-by{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink-soft);flex-wrap:wrap}
.sesh-meta{margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.starbtn{flex:none;width:56px;border:0;border-left:1px solid var(--line-soft);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted-2);
  transition:color .14s,background .14s}
.starbtn:hover{background:var(--paper-deep);color:var(--ember)}
.starbtn[aria-pressed=true]{color:var(--ember)}
.starbtn svg{transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
.starbtn[aria-pressed=true] svg{transform:scale(1.14)}
.starcount{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:13px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14.5px;z-index:20}

/* ---------- speaker gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  text-decoration:none;display:flex;flex-direction:column;gap:9px;align-items:flex-start;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.1),box-shadow .16s}
.gcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.gcard .gname{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2}
.gcard .grole{font-size:13.5px;color:var(--muted);line-height:1.4}
.gcard .gtalk{font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:9px;width:100%}

/* ---------- proposals list (backstage) ---------- */
.listhead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.counts{font-size:14.5px;color:var(--ink-soft);margin-top:6px}
.counts b{font-weight:680}
.counts .sep{color:var(--muted-2);margin:0 5px;opacity:.7}
.searchbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.searchbar input[type=text]{max-width:290px}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:0 14px;align-items:start;
  padding:14px 12px;border-bottom:1px solid var(--line-soft);cursor:default;position:relative}
.prow:hover{background:#FCFAF6}
.prow.sel{background:var(--ember-wash)}
.prow.cursor{box-shadow:inset 3px 0 0 var(--ember)}
.prow .pick{margin-top:3px;width:17px;height:17px;accent-color:var(--ember-btn);cursor:pointer}
.prow h3{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.3;margin-bottom:4px;letter-spacing:-.005em}
.prow h3 a{text-decoration:none}
.prow h3 a:hover{text-decoration:underline;text-underline-offset:2px}
.prow .pby{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow .pstate{margin-top:7px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.prow .pacts{display:flex;gap:7px;align-items:center;justify-self:end}
.score{font-variant-numeric:tabular-nums;font-weight:680;font-size:14px;color:var(--ink-soft)}
.bulkbar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--ember);
  padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:20;
  box-shadow:0 -6px 20px rgba(34,30,23,.07)}
.kbdhints{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- proposal detail ---------- */
.det{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:34px;align-items:start}
.det .rail{position:sticky;top:104px;display:flex;flex-direction:column;gap:16px}
.railbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.railbox h4{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:680}
.abstract{font-family:var(--serif);font-size:18px;line-height:1.62;color:var(--ink-soft);max-width:46em}
.abstract p{margin:0 0 1em}
.notebox{border:1px solid var(--line);border-left:3px solid var(--field-line);background:var(--paper);
  border-radius:var(--r-sm);padding:13px 15px;font-size:14.5px}

/* ---------- agenda builder ---------- */
.build{display:grid;grid-template-columns:224px minmax(0,1fr);gap:18px;align-items:start}
.torail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  position:sticky;top:104px;max-height:calc(100vh - 130px);overflow:auto}
.torail h4{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.tocard{border:1px solid var(--field-line);border-radius:var(--r-sm);padding:10px;margin-bottom:9px;
  cursor:pointer;background:var(--paper);transition:border-color .12s,background .12s,transform .1s}
.tocard:hover{background:var(--card);border-color:var(--muted-2)}
.tocard.on{border-color:var(--ember-btn);background:var(--ember-wash);box-shadow:inset 0 0 0 1px var(--ember-btn)}
.tocard .tt{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25;margin-bottom:4px}
.tocard .tm{font-size:12.8px;color:var(--muted)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.grid{border-collapse:collapse;width:100%;min-width:720px;font-size:14px;table-layout:fixed}
table.grid th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:680;
  padding:10px 8px;border-bottom:1px solid var(--line);background:var(--paper);text-align:left}
table.grid th:first-child,table.grid td:first-child{width:74px;text-align:right;padding-right:12px}
table.grid td{border-bottom:1px solid var(--line-soft);border-left:1px solid var(--line-soft);
  padding:6px;vertical-align:top;height:74px}
table.grid td.timecell{border-left:0;color:var(--muted);font-variant-numeric:tabular-nums;
  font-weight:640;font-size:13px;padding-top:10px;background:var(--paper)}
.placed{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tc);
  border-radius:var(--r-sm);padding:7px 9px;height:100%;box-shadow:var(--shadow)}
.placed .pt{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.placed .pn{font-size:12.5px;color:var(--muted);margin-top:3px}
.empty-slot{width:100%;height:100%;border:1px dashed transparent;border-radius:var(--r-sm);
  background:repeating-linear-gradient(135deg,var(--paper-deep) 0 6px,transparent 6px 12px);
  cursor:default;display:block}
.arming .empty-slot{border-color:var(--ember-line);cursor:pointer;background:var(--ember-wash)}
.arming .empty-slot:hover{border-color:var(--ember-btn);border-style:solid;box-shadow:inset 0 0 0 1px var(--ember-btn)}
.conflict{margin:14px 0 0;border:1px solid #E7D98A;background:var(--highlight);border-radius:var(--r);
  padding:13px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14.5px;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
.conflict .cwarn{font-weight:680}

/* ---------- green room (phone first) ---------- */
.gr-slot{margin:0 0 22px}
.gr-when{display:flex;gap:10px;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--ink);
  margin-bottom:14px}
.gr-when .t{font-family:var(--serif);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gr-when .r{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.gr-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:flex;gap:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.gr-card .gr-body{min-width:0;flex:1}
.gr-name{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15;margin-bottom:3px}
.gr-role{font-size:14px;color:var(--muted);margin-bottom:10px}
.gr-tel{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:640;color:var(--ember);
  text-decoration:none;padding:9px 13px;border:1px solid var(--ember-line);border-radius:100px;
  background:var(--ember-wash);margin-bottom:12px;min-height:44px}
.gr-tel:hover{background:#F6E2D2}
.gr-talk{font-size:15.5px;font-weight:600;line-height:1.35;margin-bottom:4px}
.gr-meta{font-size:13.5px;color:var(--muted)}
.gr-file{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:14px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nohead{width:56px;height:56px;border-radius:50%;border:1px dashed var(--field-line);display:flex;
  align-items:center;justify-content:center;color:var(--muted-2);flex:none;font-size:13px;text-align:center;line-height:1.15}

/* ---------- outbox ---------- */
.msg{border-bottom:1px solid var(--line-soft);padding:15px 0;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.msg .mk{font-size:12.5px;font-weight:680;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  width:118px;padding-top:3px}
.msg .msub{font-weight:640;margin-bottom:3px}
.msg .mprev{font-size:14px;color:var(--muted);line-height:1.5}
.standing{background:var(--paper-deep);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;font-size:14.5px;color:var(--ink-soft)}

/* ---------- portal ---------- */
.pcard{border-radius:var(--r);border:1px solid var(--line);background:var(--card);overflow:hidden;margin-bottom:18px}
.pcard .top{padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.pcard .bot{padding:15px 20px;background:var(--paper);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pcard.accepted{border-left:5px solid var(--go)}
.pcard.declined{border-left:5px solid var(--muted-2)}
.pcard.undecided{border-left:5px solid var(--ember)}
.pcard h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.24;margin:8px 0 6px}
.bigwhen{font-family:var(--serif);font-size:20px;font-weight:600}
.task{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;background:var(--card)}
.task summary{padding:13px 15px;cursor:pointer;display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  list-style:none;font-size:15px}
.task summary::-webkit-details-marker{display:none}
.task summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:19px;transition:transform .15s}
.task[open] summary::after{transform:rotate(90deg)}
.task .tbody{padding:0 15px 15px;border-top:1px solid var(--line-soft);padding-top:13px;font-size:14.5px}
.task .tname{font-weight:620}
.done .tname{text-decoration:line-through;text-decoration-color:var(--muted-2);color:var(--muted)}

/* ---------- empty / terminal states ---------- */
.state-out{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;
  max-width:34em}
.state-out h2{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.2;margin-bottom:10px}
.state-out p{margin:0 0 16px;color:var(--ink-soft);font-size:15.5px;line-height:1.6}
.state-out .aside{font-style:italic;color:var(--muted);font-family:var(--serif)}

/* ---------- prototype chrome ---------- */
#chrome{position:fixed;right:16px;bottom:16px;z-index:100;font-family:var(--sans);font-size:13px}
#chrome .bar{display:flex;align-items:center;gap:3px;background:#221E17;color:#EFE7DA;
  border-radius:100px;padding:5px;box-shadow:var(--shadow-lift)}
#chrome .tag{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8E8474;
  padding:0 9px 0 11px;font-weight:700}
#chrome button{border:0;background:transparent;color:#D9D0C1;border-radius:100px;padding:6px 11px;
  cursor:pointer;font-size:13px;font-weight:560;white-space:nowrap}
#chrome button:hover{background:rgba(255,255,255,.12);color:#fff}
#chrome button[aria-current]{background:var(--ember-btn);color:#fff;font-weight:640}
#chrome .rst{color:#8E8474;font-size:13px}
#chrome .fab{display:none}

/* embed mode strips chrome */
.embed .mast,.embed .foot,.embed #chrome,.embed #concierge{display:none}
.embed main{padding-top:8px}

/* ============================================================
   The Fireside concierge. One chat surface, three scopes,
   scripted. It wears the register it was opened in.
   ============================================================ */
#concierge{position:fixed;right:16px;bottom:76px;z-index:95;font-family:var(--sans);font-size:15px;
  --paper:#FAF7F2;--paper-deep:#F1EADD}
#concierge.backstage{--paper:#F6F3EE;--paper-deep:#EDE8DF}
.cc-fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--ember-btn);color:#fff;
  box-shadow:var(--shadow-lift);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3),background .14s}
.cc-fab:hover{background:var(--ember-btn-hi);transform:scale(1.05)}
.cc-fab:active{transform:scale(.96)}
.cc-panel{position:absolute;right:0;bottom:66px;width:396px;max-width:calc(100vw - 32px);
  height:min(620px,74vh);display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 10px 44px rgba(34,30,23,.24);animation:pop .2s cubic-bezier(.2,.9,.3,1.1)}
.cc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);
  border-bottom:1px solid var(--line);flex:none}
.cc-head .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.cc-head .s{font-size:12.5px;color:var(--muted)}
.cc-x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:22px;
  line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.cc-x:hover{background:var(--paper-deep);color:var(--ink)}
.cc-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.cc-you{align-self:flex-end;max-width:84%;background:var(--ember-btn);color:#fff;
  padding:9px 14px;border-radius:16px 16px 4px 16px;font-size:14.5px;line-height:1.45}
.cc-fs{align-self:stretch;font-size:14.5px;line-height:1.55;color:var(--ink)}
.cc-fs p{margin:0 0 10px}
.cc-fs p:last-child{margin-bottom:0}
.cc-fs b{font-weight:660}
.cc-lead{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink-soft)}
.cc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.cc-chip{border:1px solid var(--field-line);background:var(--card);border-radius:100px;
  padding:8px 13px;font-size:13.5px;cursor:pointer;text-align:left;color:var(--ink-soft);line-height:1.35}
.cc-chip:hover{border-color:var(--ember);color:var(--ember);background:var(--ember-wash)}
.cc-chip.wide{width:100%;border-radius:10px}
.cc-card{display:flex;gap:0;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--tc,var(--ember));border-radius:10px;overflow:hidden;margin-bottom:8px}
.cc-card .m{flex:1;padding:10px 12px;min-width:0}
.cc-card .w{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.cc-card .h{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.25}
.cc-card .h a{text-decoration:none}
.cc-card .h a:hover{text-decoration:underline;text-underline-offset:2px}
.cc-card .b{font-size:12.8px;color:var(--muted);margin-top:3px}
.cc-star{flex:none;width:46px;border:0;border-left:1px solid var(--line-soft);background:transparent;
  cursor:pointer;color:var(--muted-2);display:flex;align-items:center;justify-content:center}
.cc-star:hover{background:var(--paper-deep);color:var(--ember)}
.cc-star[aria-pressed=true]{color:var(--ember)}
.cc-row{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft);
  font-size:14px;flex-wrap:wrap}
.cc-row:last-of-type{border-bottom:0}
.cc-row .n{font-weight:620;flex:1;min-width:120px}
.cc-row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:52px;flex:none}
.cc-go{display:inline-flex;align-items:center;gap:6px;color:var(--ember);font-weight:620;
  text-decoration:none;font-size:14px;margin-top:4px}
.cc-go:hover{text-decoration:underline}
.cc-act{border:1px solid var(--ember-line);background:var(--ember-wash);color:var(--ember);
  border-radius:8px;padding:8px 13px;font-size:14px;font-weight:620;cursor:pointer;margin-top:6px}
.cc-act:hover{background:#F6E2D2}
.cc-note{background:var(--go-wash);border:1px solid #CBE0D1;border-radius:10px;padding:11px 13px;
  font-size:13.8px;color:#145635;line-height:1.5}
.cc-foot{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 12px}
.cc-ask{display:flex;gap:8px}
.cc-ask input{flex:1;font-size:15px;padding:9px 12px}
.cc-ask button{border:0;background:var(--ember-btn);color:#fff;border-radius:var(--r-sm);
  padding:0 14px;font-weight:620;cursor:pointer;font-size:14px}
.cc-hand{margin-top:9px;font-size:13px;color:var(--muted);line-height:1.5}
.cc-hand .code{font-size:13px;white-space:nowrap}
.cc-typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13.5px}
.cc-typing i{width:5px;height:5px;border-radius:50%;background:var(--muted-2);display:block;
  animation:bl 1s infinite}
.cc-typing i:nth-child(2){animation-delay:.16s}
.cc-typing i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- responsive ---------- */
/* on a wide screen the prototype chrome lives bottom-right, so bottom-sticky
   bars keep their right-hand text clear of it */
@media (min-width:721px){
  .starcount,.bulkbar{padding-right:330px}
}
@media (max-width:900px){
  .det{grid-template-columns:1fr;gap:22px}
  .det .rail{position:static}
  .build{grid-template-columns:1fr}
  .torail{position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .torail h4{grid-column:1/-1}
  .tocard{margin-bottom:0}
}
/* ============================================================
   PHONE. Verified at 390px. The green room persona is standing
   up backstage holding a phone; the agenda reader is in a
   corridor. Nothing here changes the desktop composition.
   ============================================================ */
.eg{display:none}
.mirror h3.hm{display:none}
.upnext{display:none;align-items:center;gap:6px;margin-left:auto;font-size:11.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ember);background:var(--ember-wash);
  border:1px solid var(--ember-line);border-radius:100px;padding:3px 10px}

@media (max-width:720px){
  .wrap,.wrap-wide{padding:0 16px}
  html,body{overflow-x:hidden}
  .evcards,.grid2{grid-template-columns:1fr}

  /* the page reserves the chrome bar's height so nothing sits under it */
  .stage{padding-bottom:62px}
  main{padding-bottom:26px}

  /* --- landing: the mirror reads as pairs, complaint then answer --- */
  .mirror{grid-template-columns:1fr;gap:0}
  .mirror h3.hh,.mirror h3.hp{display:none}
  .mirror h3.hm{display:block;color:var(--ink);padding:16px 0 4px}
  .mi.hate{border-top:1px solid var(--line);padding:14px 0 2px 26px;font-weight:560;color:var(--ink)}
  .mi.proud{border-top:0;padding:6px 0 16px 26px;color:var(--muted)}
  .mi.proud::before{top:6px}
  .display{font-size:clamp(27px,7.6vw,34px)}
  .onstage .display{font-size:clamp(28px,8vw,36px)}

  /* --- one-row sticky masthead, nav scrolls sideways --- */
  .mast-in{height:52px;gap:10px;flex-wrap:nowrap}
  .brand{font-size:17px}
  .mast nav{margin-left:auto;flex:1;min-width:0;justify-content:flex-end;
    overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .mast nav::-webkit-scrollbar{display:none}
  .mast nav a{padding:7px 9px;font-size:14px}

  /* --- backstage: top bar scrolls away, the nav stays --- */
  .bs-top{position:static}
  .bs-top-in{height:46px;gap:9px}
  .evt-switch{max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:12.5px;display:block;line-height:1.9}
  .bs-me span{display:none}
  .bs-nav{top:0}
  .bs-nav a,.bs-nav span{padding:12px 11px}

  /* --- anything sticky at the bottom clears the chrome bar --- */
  .starcount,.bulkbar{bottom:56px}
  .starcount{gap:10px;padding:11px 0}
  .starcount .sub{width:100%;margin-left:0!important}

  /* --- filters become one-line horizontal chip rails --- */
  .filters.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;margin:10px 0}
  .filters.scrollx > *{flex:none}
  .filters.scrollx > [data-embed]{margin-left:12px!important}
  .fchip{padding:9px 14px;font-size:14px;min-height:40px}

  /* --- public agenda: full-width cards, star as a round tap target --- */
  .sesh{border-left-width:6px;position:relative}
  .sesh-main{padding:14px 58px 14px 14px}
  .sesh h3{font-size:19px}
  .sesh-by{font-size:14px}
  .starbtn{position:absolute;top:7px;right:7px;width:44px;height:44px;border-left:0;
    border-radius:50%;background:var(--paper)}
  .starbtn:hover{background:var(--paper-deep)}
  .dayhead{margin:24px 0 10px}

  /* --- forms: 16px stops iOS zooming on focus; examples become readable --- */
  input[type=text],input[type=email],input[type=tel],textarea,select{font-size:16px;padding:12px 13px}
  .ghosthint{display:none!important}
  .fw{margin-bottom:22px}
  .fw > label.f{margin-bottom:0}
  .eg{display:block;margin:7px 0 0;border:1px solid var(--ember-line);background:var(--ember-wash);
    border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;line-height:1.5;color:#7A3A0E}
  .eg .eglab{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:700;color:var(--ember);margin-bottom:3px}
  .eg .egtxt{display:block;color:var(--ink-soft)}
  .egbtn{margin-top:8px;min-height:40px;width:100%;border:1px solid var(--ember-line);
    background:var(--card);color:var(--ember);border-radius:var(--r-sm);font-size:14px;
    font-weight:620;padding:8px 12px;cursor:pointer}
  .egbtn:active{background:var(--ember-wash)}

function wireCfp(ev){
  var boxes = Array.prototype.slice.call(document.querySelectorAll('[data-count]'));
  function tally(){
    var done = 0, seenRadio = false;
    boxes.forEach(function(b){
      if (b.type === 'radio'){ if (b.checked && !seenRadio){ done++; seenRadio = true; } return; }
      if ((b.value || '').trim()) done++;
    });
    var el = document.getElementById('cfp-count');
    if (el) el.textContent = done + ' of ' + CFP_FIELDS + ' answered';
  }
  boxes.forEach(function(b){
    b.addEventListener('input', tally); b.addEventListener('change', function(){
      tally();
      if (b.type === 'radio') document.querySelectorAll('[data-radio]').forEach(function(l){ l.classList.toggle('on', l.contains(b) && b.checked); });
    });
  });
  /* Tab accepts the example, the way shell completion already behaves.
     Typing anything first turns it off for that field. */
  document.querySelectorAll('[data-ghost]').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Tab' && !e.shiftKey && !el.value && el.placeholder){
        el.value = el.placeholder;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  });
  /* the phone equivalent of Tab: one tap accepts the printed example */
  document.querySelectorAll('[data-eg]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.preventDefault();
      var el = b.closest('.fw').querySelector('[data-ghost]');
      if (!el) return;
      el.value = el.placeholder;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      b.closest('.eg').style.display = 'none';
    });
  });
  var send = document.getElementById('cfp-send');
  if (send) send.addEventListener('click', function(){ go(url(ev + '/cfp/thanks')); });
  var save = document.getElementById('cfp-save');
  if (save) save.addEventListener('click', function(){ toast('Saved. You can close this and come back.'); });
}

/* ============================================================
   S-13  Proposals  #/admin/{event}/submissions
   ============================================================ */
var FILTERS = [['', 'All'], ['submitted', 'Undecided'], ['waitlisted', 'Maybe'], ['accepted', 'Accepted'],
               ['rejected', 'Declined'], ['draft', 'Drafts'], ['withdrawn', 'Withdrawn']];
var SEL = {}, CURSOR = 0, SHOWN = 0, LIST = [];
function propRow(s, i){
  var sp = speakersOf(s);
  return '<div class="prow' + (SEL[s.id] ? ' sel' : '') + (i === CURSOR ? ' cursor' : '') + '" data-row="' + s.id + '" data-i="' + i + '">' +
    '<input class="pick" type="checkbox" data-pick="' + s.id + '"' + (SEL[s.id] ? ' checked' : '') + ' aria-label="Select ' + h(s.title || 'this draft') + '">' +
    '<div>' +
      '<h3><a href="' + url('admin/' + s.ev + '/submissions/' + s.id) + '">' + h(s.title || 'Untitled draft') + '</a></h3>' +
      '<div class="pby"><span class="avstack">' + sp.slice(0, 3).map(function(p){ return avatar(p, 22); }).join('') + '</span>' +
        '<span>' + h(byline(s)) + '</span><span>·</span>' + tkChip(s.track) + '<span>·</span><span>' + h(s.fmt) + '</span>' +
        '<span>·</span><span>' + (s.sent ? rel(s.sent) : 'started ' + rel(s.started)) + '</span></div>' +
      '<div class="pstate">' + stateChip(s) + '<span>' + h(orgLine(s)) + '</span>' +
        (s.decided && !s.told ? '<span class="chip notold">Decided · not told</span>' : '') + '</div>' +
    '</div>' +
    '<div class="pacts">' +
      (s.score ? '<span class="score" title="Score">' + s.score + '</span>' : '<a class="link" style="font-size:13.5px" href="' + url('admin/' + s.ev + '/submissions/' + s.id) + '">Score it</a>') +
      (s.state === 'submitted' || s.state === 'waitlisted'
        ? '<button class="btn btn-sm btn-primary" data-act="accepted" data-on="' + s.id + '">Accept</button>'
        : '<a class="btn btn-sm" href="' + url('admin/' + s.ev + '/submissions/' + s.id) + '">Open</a>') +
    '</div></div>';
}
function screenSubmissions(ev){
  var c = counts(ev), st = R.q.state || '', qq = (R.q.q || '').toLowerCase();
  LIST = evSubs(ev).filter(function(s){
    if (st && s.state !== st) return false;
    if (qq && (s.title + ' ' + byline(s)).toLowerCase().indexOf(qq) < 0) return false;
    return true;
  }).sort(function(a, b){
    return (b.decided || b.sent || b.started || 0) - (a.decided || a.sent || a.started || 0);
  });
  SEL = {}; CURSOR = 0; SHOWN = 0;
  var chips = FILTERS.map(function(f){
    var cn = f[0] ? c[f[0]] : c.all;
    return '<a class="fchip" href="' + here({ state: f[0] || null }) + '" aria-pressed="' + (st === f[0]) + '">' + f[1] + ' <span class="num" style="opacity:.65">' + n(cn) + '</span></a>';
  }).join('');
  var head =
    '<div style="padding:26px 0 0"><h1 class="display">Proposals</h1>' +
    '<p class="counts"><b>' + n(c.all) + ' proposals</b><span class="sep">·</span>' + n(c.accepted) + ' accepted<span class="sep">·</span>' +
      n(c.waitlisted) + ' maybe<span class="sep">·</span>' + n(c.rejected) + ' declined<span class="sep">·</span>' +
      n(c.submitted) + ' undecided<span style="float:right;color:var(--muted)">' + h(EVENTS[ev].tz) + '</span></p></div>' +
    (c.notTold ? '<div class="sec attn"><div><div class="lab">Decided · not told · ' + n(c.notTold) + '</div>' +
      '<div class="why">Nothing has gone out. Read them before they do.</div></div>' +
      '<a class="btn btn-primary go" href="' + url('admin/' + ev + '/outbox') + '">Read them →</a></div>' : '') +
    '<div class="searchbar"><input type="text" id="q" placeholder="Search titles and speakers" value="' + h(R.q.q || '') + '">' +
      '<div class="filters scrollx" style="margin:0">' + chips + '</div></div>';

  if (!LIST.length){
    var label = (FILTERS.filter(function(f){ return f[0] === st; })[0] || ['', ''])[1].toLowerCase();
    return backstage(ev, '/submissions', head +
      '<div class="sec state-out"><h2>Nothing here.</h2>' +
      '<p>' + (qq ? 'No proposal matches “' + h(R.q.q) + '”. ' : 'No proposals are ' + h(label) + '. ') + n(c.submitted) + ' are still undecided.</p>' +
      '<a class="btn btn-primary" href="' + url('admin/' + ev + '/submissions') + '">Show all proposals →</a></div>');
  }
  return backstage(ev, '/submissions', head +
    '<div class="card" style="margin-top:14px;overflow:hidden"><div id="rows"></div>' +
    '<div id="sentinel" style="height:1px"></div></div>' +
    '<div id="bulk"></div>' +
    '<p class="sub" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap">' +
      '<span><kbd>j</kbd> <kbd>k</kbd> move</span><span><kbd>x</kbd> select</span><span><kbd>a</kbd> accept</span>' +
      '<span><kbd>Enter</kbd> open</span><span><kbd>?</kbd> keys</span></p>');
}
function paint(){
  var box = document.getElementById('rows'); if (!box) return;
  var next = LIST.slice(SHOWN, SHOWN + 60);
  var frag = document.createElement('div');
  frag.innerHTML = next.map(function(s, i){ return propRow(s, SHOWN + i); }).join('');
  while (frag.firstChild) box.appendChild(frag.firstChild);
  SHOWN += next.length;
}
function bulkBar(){
  var ids = Object.keys(SEL).filter(function(k){ return SEL[k]; });
  var el = document.getElementById('bulk'); if (!el) return;
  el.innerHTML = ids.length ? '<div class="bulkbar"><b>' + plural(ids.length, 'selected', 'selected') + '</b>' +
    '<button class="btn btn-sm btn-primary" data-bulk="accepted">Accept</button>' +
    '<button class="btn btn-sm" data-bulk="waitlisted">Maybe</button>' +
    '<button class="btn btn-sm" data-bulk="rejected">Decline</button>' +
    '<span class="sub">Nothing goes out until you send it from the outbox.</span>' +
    '<span class="kbdhints"><kbd>x</kbd> select <kbd>Esc</kbd> clear</span></div>' : '';
}
function decide(list, state){
  list.forEach(function(s){ s.state = state; s.decided = TODAY; s.told = null; if (state !== 'accepted') { s.day = null; s.time = null; s.room = null; } });
  var word = state === 'accepted' ? 'Accepted' : state === 'waitlisted' ? 'Maybe' : 'Declined';
  toast('<b>' + word + '</b> · ' + plural(list.length, 'proposal', 'proposals') + '. Staged in the outbox — nothing has gone out.');
}
function wireSubmissions(ev){
  paint();
  var sent = document.getElementById('sentinel');
  if (sent && 'IntersectionObserver' in window){
    var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting && SHOWN < LIST.length) paint(); }, { rootMargin: '600px' });
    io.observe(sent);
  }
  var q = document.getElementById('q');
  if (q){
    var t; q.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(function(){ go(here({ q: q.value || null })); }, 260); });
  }
  document.addEventListener('click', onSubClick);
  document.addEventListener('keydown', onSubKey);
  CLEANUP.push(function(){ document.removeEventListener('click', onSubClick); document.removeEventListener('keydown', onSubKey); });

  function onSubClick(e){
    var p = e.target.closest('[data-pick]');
    if (p){ SEL[p.dataset.pick] = p.checked; p.closest('.prow').classList.toggle('sel', p.checked); bulkBar(); return; }
    var a = e.target.closest('[data-act]');
    if (a){ decide([BY_ID[a.dataset.on]], a.dataset.act); rerender(); return; }
    var b = e.target.closest('[data-bulk]');
    if (b){
      var ids = Object.keys(SEL).filter(function(k){ return SEL[k]; });
      decide(ids.map(function(i){ return BY_ID[i]; }), b.dataset.bulk); SEL = {}; rerender(); return;
    }
  }
  function onSubKey(e){
    if (DLG || /input|textarea|select/i.test((e.target.tagName || ''))) { if (e.key === 'Escape') e.target.blur(); return; }
    var rows = document.querySelectorAll('.prow');
    if (e.key === 'j' || e.key === 'k'){
      CURSOR = Math.max(0, Math.min(rows.length - 1, CURSOR + (e.key === 'j' ? 1 : -1)));
      rows.forEach(function(r, i){ r.classList.toggle('cursor', i === CURSOR); });
      if (rows[CURSOR]) rows[CURSOR].scrollIntoView({ block: 'nearest' });
      e.preventDefault();
    } else if (e.key === 'x' && rows[CURSOR]){
      var id = rows[CURSOR].dataset.row; SEL[id] = !SEL[id];
      rows[CURSOR].classList.toggle('sel', SEL[id]);
      rows[CURSOR].querySelector('[data-pick]').checked = SEL[id]; bulkBar(); e.preventDefault();
    } else if (e.key === 'a' && rows[CURSOR]){
      decide([BY_ID[rows[CURSOR].dataset.row]], 'accepted'); rerender();
    } else if (e.key === 'Enter' && rows[CURSOR]){
      go(url('admin/' + ev + '/submissions/' + rows[CURSOR].dataset.row));
    } else if (e.key === 'Escape'){ SEL = {}; rerender(); }
    else if (e.key === '?'){
      dialog('Keys on this screen',
        '<span style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline">' +
        '<kbd>j</kbd><span>next proposal</span><kbd>k</kbd><span>previous</span><kbd>x</kbd><span>select this one</span>' +
        '<kbd>a</kbd><span>accept it</span><kbd>Enter</kbd><span>open it</span><kbd>Esc</kbd><span>clear the selection</span></span>',
        [{ label: 'Got it', primary: true }]);
    }
  }
}

/* ============================================================
   S-14  Proposal  #/admin/{event}/submissions/{id}
   ============================================================ */
function screenProposal(ev, id){
  var s = BY_ID[id];
  if (!s || s.ev !== ev) return backstage(ev, '/submissions',
    '<div class="sec state-out"><h2>Not on this program.</h2><p>There is no proposal with that address at ' + h(EVENTS[ev].name) + '.</p>' +

      '<div class="btnrow" style="margin-left:auto"><button class="btn" data-draft>Draft a first pass</button>' +
      '<button class="btn btn-primary" data-publish>' + (E.published ? 'Take the agenda down' : 'Publish the agenda') + '</button></div>' +
    '</div>' +

function wireBuilder(ev){
  var E = EVENTS[ev], day = R.q.day || E.days[0].k;
  document.querySelectorAll('[data-card]').forEach(function(el){
    function arm(){
      ARMED = ARMED === el.dataset.card ? null : el.dataset.card;
      document.querySelectorAll('[data-card]').forEach(function(x){ x.classList.toggle('on', x.dataset.card === ARMED); });
      document.body.classList.toggle('arming', !!ARMED);
      document.getElementById('conflict').innerHTML = '';
    }
    el.addEventListener('click', arm);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); arm(); } });
  });
  document.querySelectorAll('[data-slot]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!ARMED) return;
      var s = BY_ID[ARMED], parts = b.dataset.slot.split('|'), time = parts[0], room = parts[1];
      var clash = sessions(ev).filter(function(x){
        return x.day === day && x.time === time && x.sp.some(function(p){ return s.sp.indexOf(p) >= 0; }); })[0];
      if (clash && CONFLICT !== ARMED + b.dataset.slot){
        CONFLICT = ARMED + b.dataset.slot;
        var who = PEOPLE[clash.sp.filter(function(p){ return s.sp.indexOf(p) >= 0; })[0]];
        document.getElementById('conflict').innerHTML =
          '<div class="conflict"><span class="cwarn">⚠ ' + h(who.name) + ' is already on at ' + h(time) + ' in ' + h(clash.room) + '.</span>' +
          '<button class="btn btn-sm" data-anyway>Place it anyway</button>' +
          '<span class="sub">Or pick another slot — the rest of ' + h(dayLabel(ev, day)) + ' is open.</span></div>';
        document.querySelector('[data-anyway]').addEventListener('click', function(){ place(s, day, time, room); });
        return;
      }
      place(s, day, time, room);
    });
  });
  function place(s, day, time, room){
    s.day = day; s.time = time; s.room = room;
    ARMED = null; CONFLICT = null; document.body.classList.remove('arming');
    toast('Placed. <b>' + h(s.title) + '</b> — ' + h(dayLabel(ev, day)) + ', ' + h(time) + ', ' + h(room) + '.');
    rerender();
  }
  var d = document.querySelector('[data-draft]');
  if (d) d.addEventListener('click', function(){
    var open = [];
    (E.slots[day] || []).forEach(function(t){ E.rooms.forEach(function(rm){
      if (!sessions(ev).some(function(x){ return x.day === day && x.time === t && x.room === rm; })) open.push([t, rm]); }); });
    var todo = evSubs(ev).filter(function(s){ return s.state === 'accepted' && !s.day; })
      .sort(function(a, b){ return a.mins - b.mins; });
    var k = 0;
    todo.forEach(function(s){ if (k < open.length){ s.day = day; s.time = open[k][0]; s.room = open[k][1]; k++; } });
    toast('Drafted. ' + plural(k, 'talk placed', 'talks placed') + ' on ' + h(dayLabel(ev, day)) + '. Move anything that looks wrong.');
    rerender();
  });
  document.querySelectorAll('[data-publish]').forEach(function(p){
    p.addEventListener('click', function(e){
      e.preventDefault();
      if (E.published){
        dialog('Take the agenda down?', 'The public page will say the schedule is being updated. Speakers keep their own times in the portal.',
          [{ label: 'Take the agenda down', primary: true, run: function(){ E.published = false; toast('The public agenda is down.'); rerender(); } },
           { label: 'Leave it up' }]);
      } else {
        dialog('Publish the agenda?', 'The public page goes live with ' + plural(counts(ev).placed, 'session', 'sessions') +
          ' across ' + plural(E.rooms.length, 'room', 'rooms') + '. Speakers can already see their own times.',
          [{ label: 'Publish the agenda', primary: true, run: function(){ E.published = true; toast('Published. The public page is live.'); rerender(); } },
           { label: 'Not yet' }]);
      }
    });
  });
}

var OWED = { t1: 'a yes or no', t2: 'a headshot', t3: 'slides', t4: 'their room notes' };
function owes(p, ev){
  var seen = {}, out = [];
  subsOfPerson(p.id, ev).forEach(function(s){
    (s.tasks || []).forEach(function(t){
      if (t.doneAt || t.cancelledAt) return;
      var w = OWED[t.id] || t.name.toLowerCase();
      if (!seen[w]){ seen[w] = 1; out.push(w); }
    });
  });
  return out;
}

        '<div class="gr-name">' + h(sp[0].name) + '</div>' +
        '<div class="gr-role">' + h(sp[0].org) + ' · ' + h(sp[0].title) + '</div>' +
        (sp[0].headshot === false ? '<p class="sub" style="margin:-4px 0 10px">No headshot yet — <a class="link" href="#" onclick="toast(\'Task added. It is on their to-do list now.\');return false">ask for one</a></p>' : '') +
        '<a class="gr-tel" href="tel:' + h(sp[0].phone.replace(/\s/g, '')) + '">' + ICON.phone + h(sp[0].phone) + '</a>' +
        '<div class="gr-talk">' + h(s.title) + '</div>' +
        '<div class="gr-meta">' + h(s.fmt) + ' · ' + mins(s.mins) + (sp.length > 1 ? ' · with ' + h(sp.slice(1).map(function(p){ return p.name; }).join(' and ')) : '') + '</div>' +
        '<div class="gr-file"><b style="font-size:13.5px">Slides:</b> ' + slides + '</div>' +
      '</div></div>';
  });
  cards += '</div>';
  return backstage(ev, '/green-room', head + '<div class="sec" style="max-width:640px">' + cards +
    '<p class="hint">Phone numbers are synthetic. This sheet is built to be read standing up, on a phone, in a corridor.</p></div>');
}

/* ============================================================
   S-18  Slides  #/admin/{event}/slides?day=&room=
   ============================================================ */
function screenSlides(ev){
  var E = EVENTS[ev], day = R.q.day || '', room = R.q.room || '';
  var all = sessions(ev);
  var list = all.filter(function(s){ return (!day || s.day === day) && (!room || s.room === room); });
  var inCount = list.filter(function(s){ var t = slidesTask(s); return t && t.doneAt; }).length;
  var pct = list.length ? Math.round(inCount / list.length * 100) : 0;
  var dayTabs = '<a class="fchip" href="' + here({ day: null }) + '" aria-pressed="' + (!day) + '">Both days</a>' +
    E.days.map(function(d){ return '<a class="fchip" href="' + here({ day: d.k }) + '" aria-pressed="' + (day === d.k) + '">' + h(d.label) + '</a>'; }).join('');
  var roomTabs = '<a class="fchip" href="' + here({ room: null }) + '" aria-pressed="' + (!room) + '">All rooms</a>' +
    E.rooms.map(function(r){ return '<a class="fchip" href="' + here({ room: r }) + '" aria-pressed="' + (room === r) + '">' + h(r) + '</a>'; }).join('');
  var head = '<div style="padding:26px 0 0;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap"><div>' +
    '<h1 class="display">Slides</h1>' +
    '<p class="counts"><b>' + inCount + ' of ' + list.length + ' decks in</b> (' + pct + '%)<span class="sep">·</span>was due ' +
      h(dDayLong(E.slidesDue)) + '<span class="sep">·</span>' + h(E.tz) + '</p></div>' +
    '<button class="btn btn-primary" style="margin-left:auto" onclick="toast(\'' + inCount + ' decks zipped. It is in your downloads.\')">' +
      (day ? 'Download ' + h(dayLabel(ev, day)) + '’s slides' : 'Download all ' + inCount + ' decks') + '</button></div>' +
    '<div class="filters scrollx daybar" style="margin-top:14px">' + dayTabs + '</div>' +
    '<div class="filters scrollx daybar">' + roomTabs + '</div>';
  if (inCount === list.length && list.length){
    head += '<div class="sec attn" style="background:var(--go-wash);border-color:#CBE0D1">' +
      '<div><div class="lab">Every deck is in. ' + inCount + ' of ' + list.length + '.</div></div></div>';
  }
  var rows = list.map(function(s){
    var t = slidesTask(s), sp = speakersOf(s);
    var chip = !t ? '<span class="chip plain">Not asked for</span>'
      : t.doneAt ? '<span class="chip s-accepted">In</span>'
      : (t.due < TODAY ? '<span class="chip warn">Overdue</span>' : '<span class="chip s-undecided">Not in</span>');
    var detail = !t ? 'No slides task on this one.'
      : t.doneAt ? h(t.file.name) + ' · ' + h(t.file.size) + ' · uploaded ' + h(rel(t.doneAt))
      : 'Not in · was due ' + h(DAYN[t.due.getDay()]);
    return '<tr><td class="num" style="white-space:nowrap"><b>' + h(s.time) + '</b><br><span class="t-sub">' + h(dayLabel(ev, s.day)) + '</span></td>' +
      '<td style="white-space:nowrap">' + h(s.room) + '</td>' +
      '<td><span class="t-name">' + h(s.title) + '</span><br><span class="t-sub">' + h(sp[0].name) + ' · ' + h(s.fmt) + ' · ' + mins(s.mins) + '</span></td>' +
      '<td>' + chip + '</td>' +
      '<td><span class="t-sub">' + detail + '</span></td>' +
      '<td style="text-align:right;white-space:nowrap">' + (t && t.doneAt
        ? '<button class="btn btn-sm" onclick="toast(\'Opening ' + h(t.file.name) + '.\')">Open</button>'
        : (sp[0].email ? '<button class="btn btn-sm" onclick="toast(\'Reminder staged in the outbox.\')">Send a reminder</button>'
                       : '<span class="chip warn">Needs an address</span>')) + '</td></tr>';
  }).join('');
  return backstage(ev, '/slides', head +
    '<div class="tablewrap" style="margin-top:16px"><table class="t"><thead><tr>' +
    '<th>When</th><th>Room</th><th>Session</th><th>Slides</th><th>Detail</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>');
}

/* ============================================================
   S-19  Outbox  #/admin/{event}/outbox
   ============================================================ */
function screenOutbox(ev){
  var E = EVENTS[ev], c = counts(ev);
  var staged = evSubs(ev).filter(function(s){ return s.decided && !s.told; })
    .sort(function(a, b){ return b.decided - a.decided; });
  var sample = staged.slice(0, 24);
  var remAll = sessions(ev).filter(function(s){ var t = slidesTask(s); return t && !t.doneAt; })
    .sort(function(a, b){ return (speakersOf(a)[0].email ? 1 : 0) - (speakersOf(b)[0].email ? 1 : 0); });
  var reminders = remAll.slice(0, 4);
  var blocked = remAll.filter(function(s){ return !speakersOf(s)[0].email; });

  var head = '<div style="padding:26px 0 0"><h1 class="display">Outbox</h1>' +
    '<p class="counts">' + (staged.length ? '<b>Ready to send · ' + n(staged.length) + '</b><span class="sep">·</span>' +
      n(c.notToldAccepted) + ' accepted, ' + n(c.notToldMaybe) + ' maybe, ' + n(c.notToldDeclined) + ' declined'
      : '<b>Nothing to send</b>') + '<span class="sep">·</span>' + h(E.tz) + '</p></div>' +
    '<div class="sec standing">Messages land in each speaker’s portal. Real addresses get real email too.</div>';

  if (!staged.length){
    return backstage(ev, '/outbox', head + '<div class="sec state-out"><h2>Nothing to send.</h2>' +
      '<p>Decisions you make show up here before they go out, so you can read them first.</p>' +
      '<a class="btn btn-primary" href="' + url('admin/' + ev + '/submissions') + '">Go to proposals →</a></div>');
  }
  var batch = '<div class="sec attn"><div class="n">' + n(staged.length) + '</div>' +
    '<div><div class="lab">' + n(staged.length) + ' messages ready. Read them before they go.</div>' +
    '<div class="why">Each one carries your note. Sending writes the decision into ' + plural(staged.length, 'speaker’s portal', 'speakers’ portals') + ' at once.</div></div>' +
    '<button class="btn btn-primary go" data-send>Send ' + n(staged.length) + ' decisions</button></div>' +
    (blocked.length ? '<div class="sec" style="border:1px solid #E4C4BF;background:var(--danger-wash);border-radius:var(--r);padding:14px 16px">' +
      '<b>No email address for ' + h(speakersOf(blocked[0])[0].name) + '</b>, so her slides reminder cannot go out. ' +
      '<a class="link" href="' + url('admin/' + ev + '/people') + '">Add one on her profile →</a></div>' : '');

  var rows = sample.map(function(s){
    var p = speakersOf(s)[0];
    var kind = 'Decision';
    var sub = s.state === 'accepted' ? 'Your talk is on the program'
      : s.state === 'waitlisted' ? 'Still in the running' : 'Not this time';
    var prev = s.state === 'accepted' ? 'You are on the program at ' + E.name + '. We will write again with your time and room.'
      : s.state === 'waitlisted' ? 'Still in the running. We would like to run this if a slot opens, and we will write either way by ' + dLong(E.decideBy) + '.'
      : 'The committee did not choose this one for the 2026 program.';
    return '<div class="msg"><div class="mk">' + kind + '</div>' +
      '<div><div class="msub">' + h(sub) + ' <span class="sub" style="font-weight:400">— ' + h(p.name) + '</span></div>' +
      '<div class="mprev">' + h(prev) + '</div>' +
      '<div class="sub" style="margin-top:5px">' + h(s.title) + '</div></div>' +
      '<div>' + (p.email ? '<span class="chip s-undecided">Ready to send</span>' : '<span class="chip warn">Needs an address</span>') + '</div></div>';
  }).join('');

  var remRows = reminders.map(function(s){
    var p = speakersOf(s)[0];
    return '<div class="msg"><div class="mk">Task reminder</div>' +
      '<div><div class="msub">We still need your slides <span class="sub" style="font-weight:400">— ' + h(p.name) + '</span></div>' +
      '<div class="mprev">Your deck was due ' + h(dDayLong(E.slidesDue)) + '. Upload it in your portal any time before the day of your talk.</div></div>' +
      '<div>' + (p.email ? '<span class="chip s-undecided">Ready to send</span>' : '<span class="chip warn">Needs an address</span>') + '</div></div>';
  }).join('');

  return backstage(ev, '/outbox', head + batch +
    '<div class="sec"><h2 class="display" style="font-size:24px">Decisions</h2>' +
    '<p class="sub" style="margin:4px 0 8px">Showing ' + sample.length + ' of ' + n(staged.length) + ' — every one reads like this, with your note underneath.</p>' + rows + '</div>' +
    '<div class="sec" id="reminders"><h2 class="display" style="font-size:24px">Task reminders</h2>' + remRows + '</div>' +
    '<div class="sec"><h2 class="display" style="font-size:24px">Already sent</h2>' +
    '<div class="msg"><div class="mk">Decision</div><div><div class="msub">Your talk is on the program</div>' +
    '<div class="mprev">' + plural(counts(ev).accepted - c.notToldAccepted, 'message', 'messages') + ' went out at 17:10.</div></div>' +
    '<div class="sub">Sent ' + h(dShort(TOLD1)) + ', 17:10</div></div></div>');
}
function wireOutbox(ev){
  var b = document.querySelector('[data-send]');
  if (!b) return;
  b.addEventListener('click', function(){
    var c = counts(ev), staged = evSubs(ev).filter(function(s){ return s.decided && !s.told; });
    dialog('Send ' + n(staged.length) + ' decisions?',
      n(c.notToldAccepted) + ' accepted, ' + n(c.notToldMaybe) + ' maybe, ' + n(c.notToldDeclined) + ' declined. Each one gets your note. ' +
      'They land in each speaker’s portal — real addresses get real email too.',
      [{ label: 'Send ' + n(staged.length) + ' decisions', primary: true, run: function(){
          staged.forEach(function(s){ s.told = TODAY; });
          toast('Sent. ' + plural(staged.length, 'speaker has', 'speakers have') + ' been told.');
          rerender(); } },
       { label: 'Not yet' }]);
  });
}

function wireSettings(ev){

    var E = EVENTS[ev];
    if (E.call === 'open'){
      dialog('Close the call?', 'The public form is replaced by the date it closed and a link to the program. ' +
        n(counts(ev).submitted) + ' proposals are still undecided — closing does not decide them.',
        [{ label: 'Close the call', primary: true, run: function(){ E.call = 'closed'; E.closes = TODAY; toast('The call is closed.'); rerender(); } },
         { label: 'Leave it open' }]);

      E.call = 'open'; E.closes = D(2026,8,20,23,59); toast('The call is open. The form is back.'); rerender();
