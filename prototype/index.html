/* ============================================================
   THE FIRESIDE CONCIERGE
   One chat surface, three scopes, scripted. It is a wayfinding
   copilot: every answer ends in a door, and the doors work.
   No model runs here — these are painted conversations.
   ============================================================ */
var CHAT = { open: false, scope: null, msgs: [], busy: false };
var FOCUS = null;                      /* where render() should walk the user next */

var SCOPES = {
  pub:  { chip: 'I’m exploring the program', name: 'Exploring the program', ev: 'aie-nyc' },
  spk:  { chip: 'I’m speaking',              name: 'Speaking here',          ev: 'aie-nyc' },
  org:  { chip: 'I run this conference',     name: 'Running this conference', ev: 'aie-nyc' }
};
var STARTERS = {
  pub: ['What should I see if I care about evals?', 'Who is speaking about platform work?', 'When does the call close?'],
  spk: ['Where do things stand with my talk?', 'Where do I upload my slides?', 'Can I still change my abstract?'],
  org: ['Who in Ballroom A has not sent slides?', 'What is waiting on me right now?', 'What happens when I send the decisions?']
};

/* ---------- small builders, so answers are structured, never walls ---------- */
function ccLead(t){ return '<p class="cc-lead">' + t + '</p>'; }
function ccDoor(href, label){ return '<a class="cc-go" href="' + h(href) + '" data-ccgo="' + h(href) + '">' + h(label) + ' →</a>'; }
function ccSession(s){
  var ev = s.ev, on = stars(ev).indexOf(s.id) >= 0, sp = speakersOf(s);
  return '<div class="cc-card" style="--tc:' + TRACKS[s.track].c + '">' +
    '<div class="m"><div class="w">' + h(s.time) + ' · ' + h(dayLabel(ev, s.day)) + ' · ' + h(s.room) + '</div>' +
    '<div class="h"><a href="' + h(url(ev + '/s/' + s.id)) + '" data-ccgo="' + h(url(ev + '/s/' + s.id)) + '">' + h(s.title) + '</a></div>' +
    '<div class="b">' + h(sp[0].name) + ' · ' + h(TRACKS[s.track].name) + ' · ' + h(s.fmt) + ' · ' + mins(s.mins) + '</div></div>' +
    '<button class="cc-star" data-ccstar="' + s.id + '" data-ev="' + ev + '" aria-pressed="' + on + '" ' +
    'aria-label="' + (on ? 'Unstar' : 'Star it') + '">' + ICON.star(on) + '</button></div>';
}

/* ---------- the scripted answers ---------- */
function ccAnswer(scope, q){
  var ev = 'aie-nyc', E = EVENTS[ev], c = counts(ev);

  /* ---- PUBLIC ---- */
  if (scope === 'pub' && /eval/i.test(q)){
    var ids = ['s-evals', 's-workshop-evals', 's-guardrails'];
    return ccLead('Three, and they stack. Thursday morning is the argument, Friday morning is the ninety minutes where you actually build one.') +
      ids.map(function(i){ return ccSession(BY_ID[i]); }).join('') +
      '<p class="sub" style="font-size:13px">Starring one puts it on <b>My schedule</b>. No account, no cookie banner — it is kept in this browser.</p>' +
      ccDoor(url(ev + '/agenda', { track: 'practice' }), 'More like these');
  }
  if (scope === 'pub' && /platform|infra|engineer/i.test(q)){
    var pl = sessions(ev).filter(function(s){ return s.track === 'platform'; }).slice(0, 4);
    return ccLead('Eight talks live in the Platform lane. These four are the ones people ask about.') +
      pl.map(ccSession).join('') +
      ccDoor(url(ev + '/agenda', { track: 'platform' }), 'The whole Platform lane');
  }
  if (scope === 'pub' && /clos|deadline|when|date/i.test(q)){
    return ccLead('Open until <b>' + h(dLong(E.closes)) + ', 23:59 PT</b> — that is ' + plural(daysUntil(E.closes), 'day', 'days') + ' from today.') +
      '<div class="cc-row"><span class="n">Decisions go out by</span><span>' + h(dLong(E.decideBy)) + '</span></div>' +
      '<div class="cc-row"><span class="n">How many you may send</span><span>Up to ' + plural(E.cap, 'proposal', 'proposals') + ' per person</span></div>' +
      '<div class="cc-row"><span class="n">The event itself</span><span>' + h(E.dates) + '</span></div>' +
      '<p>No account is needed until you press send.</p>' +
      ccDoor(url(ev + '/cfp'), 'Open the call');
  }

  /* ---- SPEAKER ---- */
  if (scope === 'spk' && /upload|slides|deck/i.test(q) && /where|how/i.test(q)){
    return ccLead('In your portal, under <b>To do</b> — it is the third one, and it is overdue.') +
      '<div class="cc-row"><span class="n">Upload your slides</span><span class="chip warn">Overdue</span></div>' +
      '<p class="sub" style="font-size:13px">Was due ' + h(dDayLong(E.slidesDue)) + '. PDF or Keynote, up to 25 MB. A rough draft is genuinely fine.</p>' +
      '<button class="cc-act" data-ccwalk="slides">Take me there →</button>';
  }
  if (scope === 'spk' && /stand|status|talk|decision|hear/i.test(q)){
    var me = portalPerson(ev), mine = subsOfPerson(me.id, ev);
    return ccLead('Three proposals, three different answers.') +
      mine.map(function(s){
        var line = s.state === 'accepted' ? (s.day ? dDayLong(dayDate(s.ev, s.day)) + ', ' + s.time + ', ' + s.room : 'Time and room to come')
          : s.state === 'submitted' ? 'Decisions go out by ' + dLong(E.decideBy)
          : 'The committee did not choose this one for the 2026 program';
        return '<div class="cc-row"><span class="n">' + h(s.title) + '</span>' +
          '<span class="chip ' + LAB.cls[s.state] + '">' + h(LAB.pub[s.state]) + '</span>' +
          '<span class="sub" style="width:100%;font-size:13px">' + h(line) + '.</span></div>';
      }).join('') +
      '<p>One thing is still owed: <b>Upload your slides</b> — overdue since ' + h(dDayLong(E.slidesDue)) + '.</p>' +
      '<button class="cc-act" data-ccwalk="slides">Take me there →</button>' +
      '<div>' + ccDoor(url(ev + '/portal'), 'Open your portal') + '</div>';
  }
  if (scope === 'spk' && /need|owe|to do|todo/i.test(q)){
    var mep = portalPerson(ev), acc = subsOfPerson(mep.id, ev).filter(function(s){ return s.state === 'accepted'; })[0];
    return ccLead('Two are done, two are not.') +
      (acc ? acc.tasks.map(function(t){
        var st = taskState(t);
        return '<div class="cc-row"><span class="n">' + h(t.name) + '</span><span class="' + st.c + '">' + h(st.w) + '</span></div>';
      }).join('') : '') +
      '<button class="cc-act" data-ccwalk="slides">Take me to the slides upload →</button>' +
      '<div>' + ccDoor(url(ev + '/portal'), 'Open your portal') + '</div>';
  }
  if (scope === 'spk' && /abstract|edit|change|title/i.test(q)){
    return ccLead('Yes — every word of it, until the call closes on <b>' + h(dLong(E.closes)) + '</b>.') +
      '<p>After that the committee reads what is there. Your abstract is <b>published as-is if your talk is accepted</b>, so the title is the thing worth another pass.</p>' +
      ccDoor(url(ev + '/cfp'), 'Edit this proposal');
  }

  /* ---- ORGANIZER ---- */
  if (scope === 'org' && /ballroom|slides|deck|room/i.test(q)){
    var inRoom = sessions(ev).filter(function(s){ return s.room === 'Ballroom A'; });
    var missing = inRoom.filter(function(s){ var t = slidesTask(s); return t && !t.doneAt; });
    return ccLead(plural(inRoom.length, 'talk', 'talks') + ' in Ballroom A. ' +
      plural(inRoom.length - missing.length, 'deck is', 'decks are') + ' in, ' + missing.length + ' not.') +
      inRoom.map(function(s){
        var t = slidesTask(s), sp = speakersOf(s)[0];
        var chip = t && t.doneAt ? '<span class="chip s-accepted">In</span>' : '<span class="chip warn">Not in</span>';
        return '<div class="cc-row"><span class="t">' + h(s.time) + '<span style="display:block;font-size:11.5px">' +
          h(dayLabel(ev, s.day)) + '</span></span><span class="n">' + h(sp.name) +
          '<span class="sub" style="display:block;font-size:12.5px">' + h(s.title) + '</span></span>' + chip + '</div>';
      }).join('') +
      '<p class="sub" style="font-size:13px">Everything was due ' + h(dDayLong(E.slidesDue)) + '.</p>' +
      '<button class="cc-act" data-ccnudge="' + missing.length + '">Nudge them →</button>' +
      '<div>' + ccDoor(url('admin/' + ev + '/slides', { room: 'Ballroom A' }), 'Open the slides board for Ballroom A') + '</div>';
  }
  if (scope === 'org' && /waiting|right now|today|what.*me/i.test(q)){
    var waiting = evSubs(ev).filter(function(s){ return s.tasks && s.tasks.some(function(t){ return !t.doneAt && !t.cancelledAt; }); });
    return ccLead('Four things, in the order I would do them.') +
      '<div class="cc-row"><span class="n">Decided · not told</span><span><b>' + n(c.notTold) + '</b></span>' +
        '<span style="width:100%">' + ccDoor(url('admin/' + ev + '/outbox'), 'Read them before they go') + '</span></div>' +
      '<div class="cc-row"><span class="n">Undecided</span><span><b>' + n(c.submitted) + '</b></span>' +
        '<span style="width:100%">' + ccDoor(url('admin/' + ev + '/submissions', { state: 'submitted' }), 'Open the undecided list') + '</span></div>' +
      '<div class="cc-row"><span class="n">Accepted, not scheduled</span><span><b>' + n(c.toPlace) + '</b></span>' +
        '<span style="width:100%">' + ccDoor(url('admin/' + ev + '/agenda'), 'Open the agenda builder') + '</span></div>' +
      '<div class="cc-row"><span class="n">Speakers who owe you something</span><span><b>' + n(waiting.length) + '</b></span>' +
        '<span style="width:100%">' + ccDoor(url('admin/' + ev + '/people'), 'See who') + '</span></div>';
  }
  if (scope === 'org' && /send|decision|outbox|notify|tell/i.test(q)){
    return ccLead('Nothing goes out until you press the button, and then it all goes at once.') +
      '<p><b>Send ' + n(c.notTold) + ' decisions</b> writes ' + n(c.notToldAccepted) + ' accepted, ' + n(c.notToldMaybe) +
      ' maybe and ' + n(c.notToldDeclined) + ' declined into ' + plural(c.notTold, 'speaker’s portal', 'speakers’ portals') +
      ' in one go, each with your note.</p>' +
      '<div class="cc-note">Deciding and telling are two separate acts here. You can change your mind all week and nobody finds out until you say so.</div>' +
      ccDoor(url('admin/' + ev + '/outbox'), 'Read them in the outbox');
  }

  /* ---- the graceful fallback: still a door, never a shrug ---- */
  var fall = { pub: url('aie-nyc/agenda'), spk: url('aie-nyc/portal'), org: url('admin/aie-nyc') };
  var fallLab = { pub: 'Browse the agenda', spk: 'Open your portal', org: 'Open the program' };
  return ccLead('This is a prototype, so I only have real answers to the three questions above — but I can still put you in the right room.') +
    '<div class="cc-chips">' + STARTERS[scope].map(function(s){
      return '<button class="cc-chip wide" data-ccask="' + h(s) + '">' + h(s) + '</button>'; }).join('') + '</div>' +
    '<div>' + ccDoor(fall[scope], fallLab[scope]) + '</div>';
}

/* ---------- panel ---------- */
function ccScopeFromRoute(){
  if (R.seg[0] === 'admin') return 'org';
  if (R.seg[1] === 'portal') return 'spk';
  return 'pub';
}
function paintChat(){
  var box = document.getElementById('concierge');
  if (!box) return;
  var back = R.seg[0] === 'admin';
  box.className = back ? 'backstage' : 'onstage';
  document.body.classList.toggle('cc-open', CHAT.open);
  if (!CHAT.open){
    box.innerHTML = '<button class="cc-fab" data-ccopen aria-label="Ask the concierge">' +
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M21 11.5a8.4 8.4 0 01-9 8.4 9.6 9.6 0 01-2.9-.4L4 21l1.4-3.9A8.3 8.3 0 013 11.5 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/>' +
      '<path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg></button>';
    return;
  }
  var body;
  if (!CHAT.scope){
    body = '<div class="cc-fs">' +
      ccLead('I know this conference — the program, the call, and what is waiting on whom. Who is asking?') +
      '<div class="cc-chips">' + Object.keys(SCOPES).map(function(k){
        return '<button class="cc-chip wide" data-ccscope="' + k + '">' + h(SCOPES[k].chip) + '</button>'; }).join('') +
      '</div></div>';
  } else {
    /* answers are re-derived on every paint, so a star toggled here is never stale */
    body = CHAT.msgs.map(function(m){
      if (m.you) return '<div class="cc-you">' + h(m.text) + '</div>';
      return '<div class="cc-fs">' + (m.ask ? ccAnswer(m.scope, m.ask) : m.html) + '</div>';
    }).join('');
    if (CHAT.busy) body += '<div class="cc-fs"><span class="cc-typing"><i></i><i></i><i></i></span></div>';
    if (!CHAT.busy){
      body += '<div class="cc-fs"><p class="sub" style="font-size:12.5px;margin-bottom:6px">' +
        (CHAT.msgs.length ? 'Or ask about' : 'Try one of these') + '</p><div class="cc-chips">' +
        STARTERS[CHAT.scope].map(function(s){
          return '<button class="cc-chip wide" data-ccask="' + h(s) + '">' + h(s) + '</button>'; }).join('') + '</div></div>';
    }
  }
  box.innerHTML = '<div class="cc-panel" role="dialog" aria-label="Fireside concierge">' +
    '<div class="cc-head">' + ICON.flame +
      '<div><div class="t">The concierge</div><div class="s">' +
        (CHAT.scope ? h(SCOPES[CHAT.scope].name) + ' · <button class="link" data-ccreset style="border:0;background:none;padding:0;font-size:12.5px;cursor:pointer">change</button>' : 'AI Engineer New York 2026') +
      '</div></div>' +
      '<button class="cc-x" data-ccclose aria-label="Close">×</button></div>' +
    '<div class="cc-body" id="cc-body">' + body + '</div>' +
    '<div class="cc-foot">' +
      '<div class="cc-ask"><input type="text" id="cc-in" placeholder="Ask about the program" aria-label="Ask the concierge">' +
      '<button data-ccsend>Ask</button></div>' +
      '<p class="cc-hand">Doing something bigger? Connect your own agent: <span class="code">npx fireside mcp</span> — same tools, your scope.</p>' +
    '</div></div>';
  var b = document.getElementById('cc-body');
  if (b){
    /* land the reader at the start of the newest exchange, not the bottom of it */
    var yours = b.querySelectorAll('.cc-you'), last = yours[yours.length - 1];
    if (last) b.scrollTop = Math.max(0, last.offsetTop - b.offsetTop - 6);
    else b.scrollTop = b.scrollHeight;
  }
}
function ccAsk(q){
  CHAT.msgs.push({ you: true, text: q });
  CHAT.busy = true; paintChat();
  setTimeout(function(){
    CHAT.busy = false;
    CHAT.msgs.push({ ask: q, scope: CHAT.scope });
    paintChat();
  }, 420);
}
function ccGo(href){
  CHAT.open = false;
  document.body.classList.remove('cc-open');
  go(href);
}
/* one delegated listener, installed once — nothing to duplicate on re-render */
document.getElementById('concierge').addEventListener('click', function(e){
  var t = e.target;
  if (t.closest('[data-ccopen]')){
    CHAT.open = true;
    if (!CHAT.scope) CHAT.scope = null;
    paintChat();
    return;
  }
  if (t.closest('[data-ccclose]')){ CHAT.open = false; paintChat(); return; }
  if (t.closest('[data-ccreset]')){ CHAT.scope = null; CHAT.msgs = []; paintChat(); return; }
  var sc = t.closest('[data-ccscope]');
  if (sc){
    CHAT.scope = sc.dataset.ccscope; CHAT.msgs = [];
    CHAT.msgs.push({ html: ccLead(
      CHAT.scope === 'pub' ? 'Good. I can find talks, point you at people, and put things on your schedule.'
      : CHAT.scope === 'spk' ? 'Good. You are signed in as <b>Priya Raghunathan</b>. I can tell you where your proposals stand and walk you to whatever is owed.'
      : 'Good. I can read the list, the grid and the outbox, and take you to the thing that needs you.') });
    paintChat(); return;
  }
  var a = t.closest('[data-ccask]');
  if (a){ ccAsk(a.dataset.ccask); return; }
  var g = t.closest('[data-ccgo]');
  if (g){ ccGo(g.dataset.ccgo); return; }
  var st = t.closest('[data-ccstar]');
  if (st){
    var now = toggleStar(st.dataset.ev, st.dataset.ccstar);
    toast(now ? 'Starred from here. It is on <b>My schedule</b>.' : 'Unstarred.');
    rerender();          /* the agenda behind the panel updates too */
    paintChat();
    return;
  }
  var w = t.closest('[data-ccwalk]');
  if (w){
    FOCUS = { sel: '#task-t3', open: true, pulse: '.btn-primary' };
    ccGo(url('aie-nyc/portal'));
    return;
  }
  var nd = t.closest('[data-ccnudge]');
  if (nd){
    CHAT.msgs.push({ html:
      '<div class="cc-note"><b>' + plural(+nd.dataset.ccnudge, 'reminder', 'reminders') + ' staged in the outbox.</b> ' +
      'Nothing has gone out — read them first, then send them with everything else.</div>' +
      ccDoor(url('admin/aie-nyc/outbox'), 'Take me to the outbox') });
    FOCUS = { sel: '#reminders', pulse: null };
    paintChat();
    return;
  }
  if (t.closest('[data-ccsend]')){
    var el = document.getElementById('cc-in');
    if (el && el.value.trim()){ var v = el.value.trim(); el.value = ''; ccAsk(v); }
  }
});
document.getElementById('concierge').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'cc-in' && e.target.value.trim()){
    var v = e.target.value.trim(); e.target.value = ''; ccAsk(v);
  }
});

/* the walk: after the screen paints, open the thing and ring it once */
function walkTo(){
  if (!FOCUS) return;
  var f = FOCUS; FOCUS = null;
  setTimeout(function(){
    var el = document.querySelector(f.sel);
    if (!el) return;
    if (el.tagName === 'DETAILS') el.open = true;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    var target = (f.pulse && el.querySelector(f.pulse)) || el;
    target.classList.add('pulse');
    setTimeout(function(){ target.classList.remove('pulse'); }, 5200);
  }, 80);
}

/* ============================================================
   Dispatch
   ============================================================ */
var CLEANUP = [], LASTPATH = null;
function rerender(){ render(true); }
function render(keepScroll){
  CLEANUP.forEach(function(f){ f(); }); CLEANUP = [];
  parseHash();
  var y = window.scrollY;
  document.body.classList.toggle('embed', R.q.embed === '1');
  document.body.classList.remove('arming');
  var s = R.seg, html = '', wire = null, title = NAME;

  if (!s.length){ html = screenLanding(); title = 'An open-source call for speakers'; }
  else if (s[0] === 'admin'){
    if (s.length === 1){ html = screenAdminEvents(); title = 'Your events'; }
    else if (!EVENTS[s[1]]) html = screen404();
    else {
      var ev = s[1], E = EVENTS[ev];
      switch (s[2]){
        case undefined: html = screenProgram(ev); title = E.name; break;
        case 'submissions':
          if (s[3]){ html = screenProposal(ev, s[3]); wire = function(){ wireProposal(ev); }; title = (BY_ID[s[3]] || {}).title || 'Proposal'; }
          else { html = screenSubmissions(ev); wire = function(){ wireSubmissions(ev); }; title = 'Proposals · ' + E.name; }
          break;
        case 'agenda': html = screenBuilder(ev); wire = function(){ wireBuilder(ev); }; title = 'Agenda · ' + E.name; break;
        case 'people': html = screenPeople(ev); wire = function(){ wirePeople(ev); }; title = 'People · ' + E.name; break;
        case 'green-room': html = screenGreenRoom(ev); title = 'Green room · ' + E.name; break;
        case 'slides': html = screenSlides(ev); title = 'Slides · ' + E.name; break;
        case 'outbox': html = screenOutbox(ev); wire = function(){ wireOutbox(ev); }; title = 'Outbox · ' + E.name; break;
        case 'settings': html = screenSettings(ev); wire = function(){ wireSettings(ev); }; title = 'Settings · ' + E.name; break;
        default: html = screen404();
      }
    }
  } else if (!EVENTS[s[0]]) html = screen404();
  else {
    var e2 = s[0], EV = EVENTS[e2];
    switch (s[1]){
      case undefined: html = screenEvent(e2); title = EV.name; break;
      case 'cfp':
        if (s[2] === 'thanks'){ html = screenThanks(e2); title = 'Sent · ' + EV.name; }
        else { html = screenCfp(e2); wire = function(){ wireCfp(e2); }; title = 'Call for speakers · ' + EV.name; }
        break;
      case 'portal': html = screenPortal(e2); wire = function(){ wirePortal(e2); }; title = 'Your portal · ' + EV.name; break;
      case 'agenda': html = screenAgenda(e2); title = 'Agenda · ' + EV.name; break;
      case 's': html = screenSession(e2, s[2]); title = (BY_ID[s[2]] || {}).title || 'Session'; break;
      case 'speakers':
        if (s[2]){ html = screenSpeaker(e2, s[2]); title = (PEOPLE[s[2]] || {}).name || 'Speaker'; }
        else { html = screenSpeakers(e2); title = 'Speakers · ' + EV.name; }
        break;
      case 'my-schedule': html = screenMySchedule(e2); title = 'My schedule · ' + EV.name; break;
      default: html = screen404();
    }
  }
  document.getElementById('app').innerHTML = html;
  document.title = title === NAME ? NAME : title + ' · ' + NAME;
  if (wire) wire();
  wireGlobal();
  paintChrome();
  paintChat();
  walkTo();
  /* keep the nav item you are on inside a narrow scrolling nav */
  ['.bs-nav-in', '.mast nav'].forEach(function(sel){
    var nav = document.querySelector(sel), cur = nav && nav.querySelector('[aria-current]');
    if (nav && cur) nav.scrollLeft = Math.max(0, cur.offsetLeft - 20);
  });
  var path = R.seg.join('/');
  if (keepScroll || path === LASTPATH) window.scrollTo(0, y); else window.scrollTo(0, 0);
  LASTPATH = path;
}

/* ---------- wiring shared by every screen ---------- */
function wireGlobal(){
  document.querySelectorAll('[data-star]').forEach(function(b){
    b.addEventListener('click', function(){
      var ev = R.seg[0], id = b.dataset.star, now = toggleStar(ev, id);
      toast(now ? 'Starred. It is on <b>My schedule</b>.' : 'Unstarred.');
      rerender();
    });
  });
  document.querySelectorAll('[data-share]').forEach(function(b){
    b.addEventListener('click', function(){
      copy(location.href, 'Link copied. Anyone can open it — no account needed.');
    });
  });
  document.querySelectorAll('[data-embed]').forEach(function(b){
    b.addEventListener('click', function(){
      var ev = R.seg[0] === 'admin' ? R.seg[1] : R.seg[0];
      var what = (R.seg.indexOf('speakers') >= 0) ? '/speakers' : '/agenda';
      var src = location.origin + location.pathname + url(ev + what, Object.assign({}, R.q, { embed: '1' }));
      copy('<iframe src="' + src + '" width="100%" height="900" style="border:0" title="Programme"></iframe>',
        'Embed code copied. It carries your filters with it.');
    });
  });
  document.querySelectorAll('[data-copylink]').forEach(function(b){
    b.addEventListener('click', function(){ copy(b.dataset.copylink, 'Public link copied.'); });
  });
  document.querySelectorAll('[data-ics]').forEach(function(b){
    b.addEventListener('click', function(){
      toast('Saved. calendar.ics is in your downloads — this list stays here.');
    });
  });
}

/* ============================================================
   Prototype chrome — not part of the product. A tour bar.
   ============================================================ */
var PERSONAS = [
  ['Public', '/', function(s){ return s[0] !== 'admin' && s[1] !== 'portal'; }],
  ['Speaker', '/aie-nyc/portal', function(s){ return s[1] === 'portal'; }],
  ['Organizer', '/admin', function(s){ return s[0] === 'admin' && s[2] !== 'green-room'; }],
  ['Green room', '/admin/aie-nyc/green-room?day=thu', function(s){ return s[2] === 'green-room'; }]
];
function paintChrome(){
  var s = R.seg, box = document.getElementById('chrome');
  var cur = -1;
  PERSONAS.forEach(function(p, i){ if (cur < 0 && p[2](s)) cur = i; });
  box.className = '';
  box.innerHTML = '<div class="bar"><span class="tag">Prototype</span>' +
    PERSONAS.map(function(p, i){
      return '<button data-persona="' + h(p[1]) + '"' + (i === cur ? ' aria-current="true"' : '') + '>' + h(p[0]) + '</button>';
    }).join('') + '<button class="rst" data-reset title="Clear the stars kept in this browser">Reset</button></div>' +
    /* on a phone the bar folds into one pill, so it never sits on top of the page */
    '<button class="fab" aria-expanded="false">' + h(PERSONAS[cur < 0 ? 0 : cur][0]) + '</button>';
  box.querySelectorAll('[data-persona]').forEach(function(b){
    b.addEventListener('click', function(){ box.classList.remove('open'); go('#' + b.dataset.persona); });
  });
  var fab = box.querySelector('.fab');
  fab.addEventListener('click', function(){
    var open = box.classList.toggle('open');
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  var r = box.querySelector('[data-reset]');
  if (r) r.addEventListener('click', function(){
    Object.keys(EVENTS).forEach(function(k){ try { localStorage.removeItem(STARKEY + k); } catch (e){} });
    box.classList.remove('open');
    toast('Reset. Nothing is starred.'); rerender();
  });
}

/* ============================================================
   Boot
   ============================================================ */
window.addEventListener('hashchange', function(){ render(false); });
if (!location.hash) location.hash = '#/';
render(false);

</script>
</body>
</html>
